application.description=Cookieless website analytics. Adds the Privatus Analytics script to your site.
cms.siteId=Site ID
cms.siteId.helpText=Starts with pa_. Find it in Privatus Analytics under Site settings, Tracking.
cms.moduleEngage=Time on page and how far people scroll
cms.moduleEngage.helpText=Loads the engage module.
cms.moduleAuto=Clicks on outside links, file downloads, forms people send and missing pages (404)
cms.moduleAuto.helpText=Loads the auto module.
cms.moduleVitals=Page speed (Web Vitals)
cms.moduleVitals.helpText=Loads the vitals module.
cms.moduleClicks=Click maps
cms.moduleClicks.helpText=Loads the clicks module. It counts clicks on each link and button.
cms.moduleAsk=Short surveys on your site
cms.moduleAsk.helpText=Loads the ask module. It shows the surveys you make in Privatus Analytics.
cms.automaticallyAddToPage=Automatically add script to page
cms.automaticallyAddToPage.helpText=Untick this for a headless site that builds its pages somewhere else.
